<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Slovingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="exercises.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0b4ea2">
</head>

<body data-theme="uvod">

<header class="band">
  <div class="band__photo"></div>
  <div class="band__tint"></div>
  <div class="band__pattern"></div>
  <p class="band__credit"></p>
  <div class="wrap">
    <p class="kicker" id="kicker"></p>
    <h1 id="page-title">Slovingo</h1>
  </div>
</header>

<div class="wrap">

  <div class="toolbar">
    <button id="nav-home">🏠 <span data-ui="home">Home</span></button>
    <button id="nav-translations" class="exo-toolbar-hidden">👀 <span data-ui="toggle_translations">Translations</span></button>
    <button id="nav-exercises">🎯 <span data-ui="exercises">Exercises</span></button>
  </div>

  <main id="content">
    <p class="loading">Loading…</p>
  </main>

</div>

<footer>Slovingo v2</footer>

<script src="app.js"></script>
<script src="progress.js"></script>
<script src="exercises.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>

</html>
