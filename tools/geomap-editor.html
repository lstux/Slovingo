<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur de cartes — Slovingo</title>
<link rel="stylesheet" href="../static/vendor/leaflet/leaflet.css">
<style>
:root {
    --bg: #f6f2ea; --surface: #fffdf8; --surface-2: #ece3d3;
    --text: #2b2118; --text-soft: #6d5c48; --line: #ddd0ba;
    --accent: #a8362b; --ok: #2e9e5b; --bad: #d1483c;
    --radius: 10px; --radius-sm: 6px; font-size: 15px;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #15110d; --surface: #1e1811; --surface-2: #2a2117;
        --text: #f0e7d8; --text-soft: #b0a08b; --line: #382c1e; --accent: #e0705f;
    }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
header { padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 1.2rem; }
header p { margin: 0.2rem 0 0; color: var(--text-soft); font-size: 0.85rem; }
main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); gap: 1rem; padding: 1rem; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.8rem; }
#map { height: 460px; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.6rem; }
label { font-size: 0.85rem; color: var(--text-soft); }
input[type=text], input[type=number], select, textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 0.4rem 0.5rem; font: inherit;
}
input[type=text] { flex: 1; min-width: 8rem; }
button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 0.4rem 0.7rem; font: inherit; cursor: pointer;
}
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:hover { filter: brightness(1.08); }
#points { list-style: none; margin: 0 0 0.6rem; padding: 0; }
#points li { display: flex; gap: 0.3rem; align-items: center; margin-bottom: 0.35rem; }
#points .num { width: 1.6rem; text-align: center; font-weight: 600; color: var(--accent); }
#points .coords { font-size: 0.75rem; color: var(--text-soft); white-space: nowrap; }
#points button { padding: 0.2rem 0.45rem; }
textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 0.85rem; min-height: 9rem; }
.hint { color: var(--text-soft); font-size: 0.8rem; }
#status { font-size: 0.8rem; min-height: 1.1em; }
#results { list-style: none; padding: 0; margin: 0 0 0.6rem; }
#results li button { width: 100%; text-align: left; margin-bottom: 0.25rem; }
</style>
</head>
<body>
<header>
    <h1>Éditeur de cartes</h1>
    <p>Cliquer sur la carte (ou chercher un lieu) pour ajouter des points, puis copier le code dans une fiche .md.</p>
</header>
<main>
    <section class="panel">
        <div class="row">
            <input type="text" id="search" placeholder="Chercher un lieu (ex. Bratislavský hrad)">
            <button id="searchBtn">Chercher</button>
        </div>
        <ul id="results"></ul>
        <div id="map"></div>
        <p class="hint">Clic = nouveau point · glisser un marqueur = le déplacer. La recherche utilise Nominatim (OpenStreetMap), uniquement quand on clique sur « Chercher ».</p>
    </section>
    <section class="panel">
        <div class="row">
            <label>Titre <input type="text" id="title" placeholder="(facultatif)"></label>
        </div>
        <div class="row">
            <label><input type="checkbox" id="route"> Trajet (relier les points)</label>
            <label>Fond
                <select id="layer">
                    <option value="osm">OpenStreetMap</option>
                    <option value="topo">OpenTopoMap (relief)</option>
                    <option value="light">CARTO clair</option>
                    <option value="dark">CARTO sombre</option>
                </select>
            </label>
            <label><input type="checkbox" id="useZoom"> Zoom fixe : <b id="zoomVal">–</b></label>
        </div>
        <ul id="points"></ul>
        <div class="row">
            <button id="clear">Tout effacer</button>
        </div>
        <label for="output">Code SMD à copier</label>
        <textarea id="output" readonly></textarea>
        <div class="row">
            <button class="primary" id="copy">Copier</button>
            <span id="status"></span>
        </div>
        <label for="import">Importer un bloc existant (coller puis « Charger »)</label>
        <textarea id="import" style="min-height:4.5rem"></textarea>
        <div class="row"><button id="load">Charger</button></div>
    </section>
</main>
<script>
// Leaflet: vendored copy first (works from a repo checkout), CDN as a fallback.
function boot() { window.__leafletReady = true; }
</script>
<script src="../static/vendor/leaflet/leaflet.js" onerror="this.remove();var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=function(){document.dispatchEvent(new Event('leaflet-late'))};document.head.appendChild(s)"></script>
<script>
function init() {
    // Keep in sync with static/geomap.js (LAYERS) and GEOMAP_LAYERS in src/smd2data.py.
    const OSM = '&copy; OpenStreetMap contributors';
    const CARTO = OSM + ' &copy; CARTO';
    const TILES = {
        osm: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: OSM }],
        topo: ["https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, subdomains: "abc", attribution: OSM + ' | &copy; OpenTopoMap' }],
        light: ["https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { maxZoom: 20, subdomains: "abcd", attribution: CARTO }],
        dark: ["https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom: 20, subdomains: "abcd", attribution: CARTO }],
    };
    const $ = (id) => document.getElementById(id);
    const map = L.map("map").setView([48.7, 19.7], 7);   // Slovakia
    let tileLayer = null, polyline = null;
    let points = [];   // { lat, lon, label, marker }

    function setLayer() {
        if (tileLayer) map.removeLayer(tileLayer);
        const [url, opts] = TILES[$("layer").value];
        tileLayer = L.tileLayer(url, opts).addTo(map);
    }
    const r5 = (x) => Math.round(x * 1e5) / 1e5;

    function icon(n) {
        return L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
            html: '<div style="width:26px;height:26px;border-radius:50%;background:#a8362b;color:#fff;font:600 13px/22px system-ui;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0006">' + n + '</div>' });
    }

    function addPoint(lat, lon, label) {
        const p = { lat: r5(lat), lon: r5(lon), label: label || "" };
        p.marker = L.marker([p.lat, p.lon], { draggable: true }).addTo(map);
        p.marker.on("dragend", () => {
            const ll = p.marker.getLatLng();
            p.lat = r5(ll.lat); p.lon = r5(ll.lng);
            refresh();
        });
        points.push(p);
        refresh();
    }

    function removePoint(i) {
        map.removeLayer(points[i].marker);
        points.splice(i, 1);
        refresh();
    }

    function move(i, d) {
        const j = i + d;
        if (j < 0 || j >= points.length) return;
        [points[i], points[j]] = [points[j], points[i]];
        refresh();
    }

    function generate() {
        if (!points.length) return "";
        const out = [];
        const title = $("title").value.trim();
        const route = $("route").checked;
        if (route) out.push("%~" + (title ? " " + title : ""));
        else if (title) out.push("%: " + title);
        const zoom = $("useZoom").checked ? "z" + map.getZoom() : "";
        const layer = $("layer").value !== "osm" ? $("layer").value : "";
        points.forEach((p, i) => {
            const parts = [p.lat + ", " + p.lon];
            // zoom/layer are map-wide: written once, on the first point.
            const label = p.label.trim().replace(/\|/g, "/");
            if (label || (i === 0 && (zoom || layer))) parts.push(label);
            if (i === 0 && zoom) parts.push(zoom);
            if (i === 0 && layer) parts.push(layer);
            out.push("% " + parts.join(" | ").replace(/ \| $/, ""));
        });
        return out.join("\n");
    }

    function refresh() {
        const list = $("points");
        list.innerHTML = "";
        points.forEach((p, i) => {
            p.marker.setIcon(icon(i + 1));
            const li = document.createElement("li");
            li.innerHTML = '<span class="num">' + (i + 1) + '</span>';
            const input = document.createElement("input");
            input.type = "text"; input.placeholder = "libellé"; input.value = p.label;
            input.oninput = () => { p.label = input.value; $("output").value = generate(); };
            li.appendChild(input);
            const c = document.createElement("span");
            c.className = "coords"; c.textContent = p.lat + ", " + p.lon;
            li.appendChild(c);
            [["↑", () => move(i, -1)], ["↓", () => move(i, 1)], ["✕", () => removePoint(i)]].forEach(([t, f]) => {
                const b = document.createElement("button"); b.textContent = t; b.onclick = f; li.appendChild(b);
            });
            list.appendChild(li);
        });
        if (polyline) { map.removeLayer(polyline); polyline = null; }
        if ($("route").checked && points.length > 1) {
            polyline = L.polyline(points.map((p) => [p.lat, p.lon]), { color: "#a8362b", weight: 4 }).addTo(map);
        }
        $("zoomVal").textContent = map.getZoom();
        $("output").value = generate();
    }

    function load(text) {
        points.forEach((p) => map.removeLayer(p.marker));
        points = [];
        $("title").value = ""; $("route").checked = false; $("useZoom").checked = false;
        text.split("\n").forEach((raw) => {
            const line = raw.trim();
            let m = line.match(/^%([~:])(?:\s+(.*))?$/);
            if (m) { $("route").checked = m[1] === "~"; $("title").value = m[2] || ""; return; }
            m = line.match(/^%\s+(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*(?:\|(.*))?$/);
            if (!m) return;
            let label = "";
            (m[3] || "").split("|").map((f) => f.trim()).filter(Boolean).forEach((f) => {
                const z = f.match(/^z(\d{1,2})$/i);
                if (z) { $("useZoom").checked = true; map.setZoom(+z[1]); }
                else if (TILES[f.toLowerCase()]) $("layer").value = f.toLowerCase();
                else if (!label) label = f;
            });
            addPoint(+m[1], +m[2], label);
        });
        setLayer();
        if (points.length) map.fitBounds(points.map((p) => [p.lat, p.lon]), { padding: [30, 30], maxZoom: 16 });
        refresh();
    }

    async function search() {
        const q = $("search").value.trim();
        if (!q) return;
        const ul = $("results");
        ul.innerHTML = "<li class='hint'>Recherche…</li>";
        try {
            const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&q=" + encodeURIComponent(q),
                { headers: { "Accept-Language": "fr" } });
            const data = await res.json();
            ul.innerHTML = data.length ? "" : "<li class='hint'>Aucun résultat.</li>";
            data.forEach((d) => {
                const li = document.createElement("li");
                const b = document.createElement("button");
                b.textContent = d.display_name;
                b.onclick = () => {
                    map.setView([+d.lat, +d.lon], 15);
                    addPoint(+d.lat, +d.lon, d.display_name.split(",")[0]);
                    ul.innerHTML = "";
                };
                li.appendChild(b); ul.appendChild(li);
            });
        } catch (e) {
            ul.innerHTML = "<li class='hint'>Recherche impossible (réseau ?).</li>";
        }
    }

    map.on("click", (e) => addPoint(e.latlng.lat, e.latlng.lng, ""));
    map.on("zoomend", () => { $("zoomVal").textContent = map.getZoom(); if ($("useZoom").checked) $("output").value = generate(); });
    ["title", "route", "useZoom"].forEach((id) => $(id).addEventListener("input", refresh));
    $("layer").addEventListener("input", () => { setLayer(); refresh(); });
    $("searchBtn").onclick = search;
    $("search").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
    $("clear").onclick = () => { points.forEach((p) => map.removeLayer(p.marker)); points = []; refresh(); };
    $("load").onclick = () => load($("import").value);
    $("copy").onclick = async () => {
        const text = $("output").value;
        if (!text) { $("status").textContent = "Rien à copier."; return; }
        try { await navigator.clipboard.writeText(text); }
        catch (e) { $("output").select(); document.execCommand("copy"); }
        $("status").textContent = "Copié ✔";
        setTimeout(() => ($("status").textContent = ""), 1800);
    };
    setLayer();
    refresh();
}
if (window.L) init();
else document.addEventListener("leaflet-late", init);
</script>
</body>
</html>
