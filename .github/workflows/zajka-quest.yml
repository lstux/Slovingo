name: Zajka Quest (ODROID-GO)

# Compile le jeu Zajka Quest (esp32/zajka-quest) : firmware PlatformIO + ZajkaQuest.fw pour le
# firmware d'origine de l'ODROID-GO, et un test du jeu dans le simulateur PC.
# Les fichiers sont dans les « Artifacts » de l'execution (onglet Actions).

on:
  push:
    paths:
      - "esp32/zajka-quest/**"
      - ".github/workflows/zajka-quest.yml"
  pull_request:
    paths:
      - "esp32/zajka-quest/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32/zajka-quest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/zajka-quest/platformio.ini') }}

      - name: Simulateur PC (cours embarque, chapitres 1 a 3 en entier, reprise)
        run: |
          make -C sim
          ./build/sim --course
          mkdir -p /tmp/zq
          rm -f /tmp/zq.sav
          # chapitre 1 : panneaux, ticket, conducteur, tram (episodes, revizor, composteur), tante, fin
          ./build/sim --script sim/chapter.txt --auto --save /tmp/zq.sav --out /tmp/zq --expect "titre,chapitre,carte:kosice_hlavna,mots:1,mots:2,parle:passant,objet:lístok,parle:passant,parle:passant,carte:kosice_tram,parle:Andrea,bonus:2,parle:Andrea,bonus:4,parle:passant,parle:passant,parle:Andrea,bonus:5,parle:Andrea,bonus:6,parle:Andrea,bonus:8,carte:kosice_teta,parle:Andrea,bonus:9,fin,chapitre,carte:sucho_zahrada"
          # la partie reprend au debut du chapitre 2
          ./build/sim --script sim/resume.txt --auto --save /tmp/zq.sav --out /tmp/zq --expect reprise,carte:sucho_zahrada
          # chapitre 2 : jardin, rue, parc (gouttes d'eau), centre, gare, fin
          ./build/sim --chapter 2 --script sim/chapter2.txt --auto --out /tmp/zq --expect "chapitre,carte:sucho_zahrada,bonus:2,objet:voda,carte:sucho_cesta,mots:1,bonus:3,carte:sucho_park,bonus:4,objet:kvapkax5,parle:passant,parle:Andrea,bonus:6,objet:batoh,carte:sucho_cesta,carte:sucho_hlavna,bonus:7,carte:sucho_stanica,objet:lístky na vlak,fin,chapitre"
          # chapitre 3 : gare, foret silencieuse, ruisseau, gorge (champ de planches), pan Orol, camp, fin
          ./build/sim --chapter 3 --script sim/chapter3.txt --auto --out /tmp/zq --expect "chapitre,carte:raj_stanica,carte:raj_les,objet:fľaša,parle:Andrea,carte:raj_roklina,parle:Andrea,carte:raj_orol,objet:bunda,carte:raj_taborisko,fin"
          # sans traduction ouverte ni erreur, et seulement alors, les repliques secretes
          ./build/sim --script sim/chapter.txt --auto-peek --out /tmp/zq --expect carte:kosice_teta,parle:Andrea,bonus:0,fin
          ./build/sim --script sim/chapter.txt --auto-wrong --out /tmp/zq --expect carte:kosice_teta,parle:Andrea,bonus:0,fin
          ./build/sim --chapter 2 --script sim/chapter2.txt --auto-peek --out /tmp/zq --expect carte:sucho_stanica,bonus:0,fin
          ./build/sim --chapter 3 --script sim/chapter3.txt --auto-peek --out /tmp/zq --expect carte:raj_taborisko,bonus:0,fin
          ./build/sim --chapter 3 --script sim/chapter3.txt --auto-wrong --out /tmp/zq --expect carte:raj_taborisko,bonus:0,fin

      - name: PlatformIO
        run: pip install platformio

      - name: Build firmware (ESP-IDF, celui qui demarre depuis le .fw)
        run: pio run -e odroid-go-idf

      - name: Build firmware (Arduino, flashage USB seulement)
        run: pio run -e odroid-go

      - uses: actions/upload-artifact@v4
        with:
          name: ZajkaQuest-odroid-go
          path: |
            esp32/zajka-quest/.pio/build/odroid-go-idf/ZajkaQuest.fw
            esp32/zajka-quest/.pio/build/odroid-go-idf/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ZajkaQuest-odroid-go-arduino
          path: |
            esp32/zajka-quest/.pio/build/odroid-go/ZajkaQuest.fw
            esp32/zajka-quest/.pio/build/odroid-go/firmware.bin
