name: Zajka Quest (ODROID-GO)

# Compile le jeu Zajka Quest (esp32/zajka-quest) : firmware PlatformIO + ZajkaQuest.fw pour le
# firmware d'origine de l'ODROID-GO, et un test du jeu dans le simulateur PC.
# Les fichiers sont dans les « Artifacts » de l'execution (onglet Actions).

on:
  push:
    paths:
      - "esp32/zajka-quest/**"
      - ".github/workflows/zajka-quest.yml"
  pull_request:
    paths:
      - "esp32/zajka-quest/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32/zajka-quest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/zajka-quest/platformio.ini') }}

      - name: Simulateur PC (cours embarque, chapitre 1 en entier, reprise)
        run: |
          make -C sim
          ./build/sim --course
          mkdir -p /tmp/zq
          # le chapitre 1 : passant, tram (episodes 1 a 5), chez la tante (6), le pommier, la fin
          ./build/sim --script sim/chapter.txt --auto --save /tmp/zq.sav --out /tmp/zq --expect \
            titre,chapitre,carte:kosice_hlavna,parle:passant,carte:kosice_tram,parle:Andrea,bonus:2,parle:Andrea,bonus:4,parle:Andrea,bonus:5,parle:Andrea,bonus:6,parle:Andrea,bonus:8,carte:kosice_teta,parle:Andrea,bonus:9,fin,titre
          # la partie reprend sous le pommier, avec ses repliques secretes
          ./build/sim --script sim/resume.txt --auto --save /tmp/zq.sav --out /tmp/zq --expect reprise,bonus:9,carte:kosice_teta,fin
          # sans traduction ouverte ni erreur, et seulement alors, les repliques secretes
          ./build/sim --script sim/chapter.txt --auto-peek --out /tmp/zq --expect carte:kosice_teta,parle:Andrea,bonus:0,fin
          ./build/sim --script sim/chapter.txt --auto-wrong --out /tmp/zq --expect carte:kosice_teta,parle:Andrea,bonus:0,fin
          # aller-retour rue / tram apres le premier episode
          ./build/sim --script sim/walk.txt --auto --out /tmp/zq --expect carte:kosice_tram,parle:Andrea,bonus:2,carte:kosice_hlavna

      - name: PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - uses: actions/upload-artifact@v4
        with:
          name: ZajkaQuest-odroid-go
          path: |
            esp32/zajka-quest/.pio/build/odroid-go/ZajkaQuest.fw
            esp32/zajka-quest/.pio/build/odroid-go/firmware.bin
