name: Zajka Quest (ODROID-GO)

# Compile le jeu Zajka Quest (esp32/zajka-quest) : firmware PlatformIO + ZajkaQuest.fw pour le
# firmware d'origine de l'ODROID-GO, et un test du jeu dans le simulateur PC.
# Les fichiers sont dans les « Artifacts » de l'execution (onglet Actions).

on:
  push:
    paths:
      - "esp32/zajka-quest/**"
      - ".github/workflows/zajka-quest.yml"
  pull_request:
    paths:
      - "esp32/zajka-quest/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32/zajka-quest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/zajka-quest/platformio.ini') }}

      - name: Simulateur PC (cours embarque, parcours du chapitre 1)
        run: |
          make -C sim
          ./build/sim --course
          mkdir -p /tmp/zq
          ./build/sim --script sim/walk.txt --out /tmp/zq \
            --expect titre,chapitre,carte:kosice_hlavna,carte:kosice_tram,parle:Andrea,carte:kosice_hlavna

      - name: PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - uses: actions/upload-artifact@v4
        with:
          name: ZajkaQuest-odroid-go
          path: |
            esp32/zajka-quest/.pio/build/odroid-go/ZajkaQuest.fw
            esp32/zajka-quest/.pio/build/odroid-go/firmware.bin
