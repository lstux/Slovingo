<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slovingo</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #fff7ed; --card: #ffffff; --ink: #2b2118; --muted: #7a6a5c;
    --line: #f0dcc8; --accent: #e8590c; --shadow: 0 2px 10px rgba(120, 70, 20, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1712; --card: #2a2119; --ink: #f6ebdd; --muted: #b9a998; --line: #3d3125; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 2rem 16px 3rem; }
  h1 { margin: 0 0 .25rem; font-size: 2rem; }
  .sub { margin: 0 0 1.5rem; color: var(--muted); }
  details.group { margin: 0 0 .9rem; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); }
  details.group > summary { list-style: none; cursor: pointer; padding: .9rem 1rem; display: flex; align-items: center;
    gap: .7rem; font-weight: 700; font-size: 1.15rem; border-radius: 16px; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary .gflag { font-size: 1.6rem; line-height: 1; }
  details.group > summary .count { margin-left: auto; font-size: .8rem; font-weight: 600; color: var(--muted); }
  details.group > summary::after { content: "▾"; color: var(--muted); transition: transform .2s; }
  details.group[open] > summary::after { transform: rotate(180deg); }
  details.group > summary:focus-visible { outline: 3px solid var(--accent); }
  ul { list-style: none; margin: 0; padding: 0 .75rem .75rem; display: grid; gap: .7rem; }
  a.course { display: flex; gap: .9rem; align-items: stretch; text-decoration: none; overflow: hidden;
    color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-left: 6px solid var(--c, var(--accent)); border-radius: 14px; }
  a.course:active, a.course:focus-visible { outline: 3px solid var(--c, var(--accent)); outline-offset: 2px; }
  .thumb { flex: none; width: 7.5rem; background: var(--line) center / cover no-repeat; display: flex;
    align-items: center; justify-content: center; font-size: 2.4rem; }
  .txt { min-width: 0; padding: .7rem .8rem .7rem 0; }
  .txt strong { display: block; font-size: 1.05rem; }
  .txt .pitch { display: block; color: var(--muted); font-size: .88rem; margin-top: .15rem; }
  .meta { margin-top: .3rem; font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: center; }
  .tag { background: var(--line); border-radius: 999px; padding: .05rem .55rem; }
  .pals { font-size: 1rem; }
  .last { font-size: .8rem; color: var(--c, var(--accent)); font-weight: 600; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    border-radius: 999px; padding: .08rem .55rem; color: #fff; background: var(--muted); }
  .badge.ready { background: #2e7d32; } .badge.review { background: #1565c0; } .badge.beta { background: #ef6c00; }
  .badge.build { background: #6d4c41; } .badge.draft { background: #757575; }
  .repo { display: inline-block; margin: .35rem 0 0 .4rem; font-size: .85rem; color: var(--muted); text-decoration: underline; }
  .repo:focus-visible { outline: 3px solid var(--accent); }
  @media (max-width: 420px) { a.course { flex-direction: column; border-left-width: 1px; border-top: 6px solid var(--c, var(--accent)); }
    .thumb { width: 100%; height: 9rem; } .txt { padding: 0 .9rem .8rem; } }
  #status { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Slovingo</h1>
  <p class="sub">Choisis ton cours</p>
  <p id="status">Chargement…</p>
  <div id="list" hidden></div>
</main>
<script>
(function () {
  "use strict";
  var KEY = "slovingo:last-course";
  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("list");
  var forceChoose = new URLSearchParams(location.search).has("choose");

  function recall() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function remember(id) { try { localStorage.setItem(KEY, id); } catch (e) {} }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  }

  function render(courses, last) {
    var groups = [], byId = {};
    courses.forEach(function (c) {
      var g = c.group || c.id;
      if (!byId[g]) { byId[g] = { label: c.group_label || g, flag: c.flag, items: [] }; groups.push(byId[g]); }
      byId[g].items.push(c);
    });
    groups.forEach(function (g) {
      var det = document.createElement("details");
      det.className = "group";
      var sum = document.createElement("summary");
      var fl = document.createElement("span");
      fl.className = "gflag"; fl.textContent = g.flag || "📘";
      var lab = document.createElement("span");
      lab.textContent = g.label;
      var cnt = document.createElement("span");
      cnt.className = "count"; cnt.textContent = g.items.length;
      sum.appendChild(fl); sum.appendChild(lab); sum.appendChild(cnt);
      det.appendChild(sum);
      var ul = document.createElement("ul");
      g.items.forEach(function (c) { ul.appendChild(card(c, last)); });
      det.appendChild(ul);
      listEl.appendChild(det);
    });
    statusEl.hidden = true;
    listEl.hidden = false;
  }

  function card(c, last) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "course";
    a.href = c.id + "/";
    if (c.theme_color) a.style.setProperty("--c", c.theme_color);

    var th = document.createElement("div");
    th.className = "thumb";
    if (c.cover) th.style.backgroundImage = "url('" + c.cover + "')";
    else th.textContent = c.flag || "📘";

    var txt = document.createElement("div");
    txt.className = "txt";
    var title = document.createElement("strong");
    title.textContent = c.title || c.id;
    txt.appendChild(title);
    var blurb = c.pitch || c.description;
    if (blurb) {
      var d = document.createElement("span");
      d.className = "pitch"; d.textContent = blurb;
      txt.appendChild(d);
    }
    var meta = document.createElement("div");
    meta.className = "meta";
    if (c.audience) { var t = document.createElement("span"); t.className = "tag"; t.textContent = c.audience; meta.appendChild(t); }
    if (c.companions && c.companions.length) {
      var p = document.createElement("span"); p.className = "pals"; p.textContent = c.companions.join(" "); meta.appendChild(p);
    }
    if (c.status) {
      var b = document.createElement("span"); b.className = "badge " + c.status; b.textContent = c.status; meta.appendChild(b);
    }
    if (c.id === last) {
      var l = document.createElement("span"); l.className = "last"; l.textContent = "Dernier cours"; meta.appendChild(l);
    }
    if (meta.childNodes.length) txt.appendChild(meta);

    a.appendChild(th);
    a.appendChild(txt);
    a.addEventListener("click", function () { remember(c.id); });
    li.appendChild(a);
    if (c.repo) {
      var r = document.createElement("a");
      r.className = "repo"; r.href = c.repo; r.target = "_blank"; r.rel = "noopener";
      r.textContent = "Dépôt GitHub";
      li.appendChild(r);
    }
    return li;
  }

  fetch("courses.json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var courses = (data && data.courses) || [];
      var last = recall();
      var known = courses.some(function (c) { return c.id === last; });
      if (known && !forceChoose) {
        // Retour direct au dernier cours ; ?choose force l'affichage de la liste.
        location.replace(last + "/");
        return;
      }
      if (!courses.length) { statusEl.textContent = "Aucun cours disponible."; return; }
      render(courses, known ? last : null);
    })
    .catch(function () { statusEl.textContent = "Impossible de charger la liste des cours."; });
})();
</script>
</body>
</html>
