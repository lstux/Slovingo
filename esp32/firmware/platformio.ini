; Slovingo pour la LilyGo T-HMI (ESP32-S3, ecran 2,8" 320x240, tactile resistif, microSD)
;
;   pio run                 build, le .bin est dans .pio/build/t-hmi/firmware.bin
;   pio run -t upload       flasher en USB (ou installer le .bin depuis le Launcher)
;   pio device monitor      logs, 115200 bauds

[platformio]
default_envs = t-hmi

[env:t-hmi]
platform = espressif32@~6.5.0
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
upload_protocol = esptool

; Le code de l'app est partage avec l'app de la montre (../twatch-app/slovingo),
; scripts/add_app.py l'ajoute au build.
extra_scripts = post:scripts/add_app.py

lib_deps =
    https://github.com/lvgl/lvgl.git#v7.11.0
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@~6.21.5

build_type = release
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -Os
    ; includes du projet et couche de remplacement des API du firmware de la montre
    -I include
    -I src/compat
    ; LVGL 7.11 : lv_conf.h est dans include/
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    ; TFT_eSPI : ecran ST7789 en 8 bits parallele (reglages de la LilyGo, setup 207)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
    -D TFT_PARALLEL_8_BIT
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=-1
    -D TFT_WR=8
    -D TFT_RD=-1
    -D TFT_D0=48
    -D TFT_D1=47
    -D TFT_D2=39
    -D TFT_D3=40
    -D TFT_D4=41
    -D TFT_D5=42
    -D TFT_D6=45
    -D TFT_D7=46
    -D TFT_BL=38
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
