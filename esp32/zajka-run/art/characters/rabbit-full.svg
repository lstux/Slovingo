<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img" aria-labelledby="rbf-t">
  <title id="rbf-t">Andrea, la hase, en pied</title>
  <!--
    Andrea (Zajka Friends) en pied, ~3,5 têtes de haut, pose neutre et souriante.
    Tête : identique à rabbit.svg de MathPulse (réduite à 52 %). Tenue d'été d'une lycéenne de
    Košice (celle des prompts de art/PROMPTS.md), à la place de la combinaison de MathPulse :
      t-shirt vert menthe #7fd6b0 (col, bas des manches #5fb894) · short en jean #4a6fa5
      (ourlet #3a5888) · baskets rouges #d63a3a (semelle #f4f4f4) · petit sac jaune #fbbf24
      (bandoulière #d99a00) · pelage des bras et des jambes #b5c1c6
    Groupes à modifier pour changer de pose : #rbf-arm-wave, #rbf-arm-bag.
  -->
  <defs>
    <g id="rbf-shoe">
      <path d="M202 690 H240 L240 722 C240 732 234 738 224 738 H186 C176 738 172 730 178 722 C186 712 202 708 202 690Z" fill="#d63a3a"/>
      <path d="M174 730 H240 V738 C240 742 236 745 232 745 H182 C175 745 171 738 174 730Z" fill="#f4f4f4"/>
      <path d="M204 702 H234" stroke="#f4f4f4" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>

  <ellipse id="rbf-shadow" cx="240" cy="745" rx="96" ry="10" fill="#1a1a2e" opacity=".16"/>

  <!-- jambes : pelage, short en jean, baskets ; jambe gauche = enfants pairs, droite = impairs -->
  <g id="rbf-legs">
    <path d="M190 520 H240 L236 696 H204Z" fill="#b5c1c6"/>
    <path d="M290 520 H240 L244 696 H276Z" fill="#b5c1c6"/>
    <path d="M184 512 H242 L240 604 H190Z" fill="#4a6fa5"/>
    <path d="M296 512 H238 L240 604 H290Z" fill="#4a6fa5"/>
    <use href="#rbf-shoe"/>
    <use href="#rbf-shoe" transform="translate(480 0) scale(-1 1)"/>
  </g>

  <!-- bras qui salue -->
  <g id="rbf-arm-wave">
    <path d="M292 382 C322 394 338 374 346 348" fill="none" stroke="#b5c1c6" stroke-width="26" stroke-linecap="round"/>
    <path d="M290 380 C300 388 310 390 318 388" fill="none" stroke="#7fd6b0" stroke-width="32" stroke-linecap="round"/>
    <path d="M318 378 L320 398" stroke="#5fb894" stroke-width="7" stroke-linecap="round"/>
    <circle cx="349" cy="330" r="15" fill="#b5c1c6"/>
    <g fill="#b5c1c6"><ellipse cx="341" cy="315" rx="5" ry="9"/><ellipse cx="350" cy="312" rx="5" ry="10"/><ellipse cx="359" cy="316" rx="5" ry="9"/><ellipse cx="335" cy="333" rx="5" ry="9" transform="rotate(-30 335 333)"/></g>
  </g>

  <!-- torse : t-shirt, bandoulière du sac -->
  <g id="rbf-torso">
    <path d="M184 374 C206 362 274 362 296 374 L298 430 C297 462 300 492 302 518 L178 518 C180 492 183 462 182 430Z" fill="#7fd6b0"/>
    <path d="M214 366 C226 378 254 378 266 366" fill="none" stroke="#5fb894" stroke-width="7" stroke-linecap="round"/>
    <path d="M284 376 L196 498" fill="none" stroke="#d99a00" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- bras gauche, le long du corps ; le petit sac jaune sur la hanche -->
  <g id="rbf-arm-bag">
    <rect x="150" y="480" width="44" height="34" rx="8" fill="#fbbf24"/>
    <path d="M154 492 H190" stroke="#d99a00" stroke-width="4"/>
    <path d="M188 380 C168 420 164 460 170 494" fill="none" stroke="#b5c1c6" stroke-width="26" stroke-linecap="round"/>
    <path d="M190 378 C182 392 178 404 176 416" fill="none" stroke="#7fd6b0" stroke-width="32" stroke-linecap="round"/>
    <path d="M164 412 L188 418" stroke="#5fb894" stroke-width="7" stroke-linecap="round"/>
    <circle cx="170" cy="506" r="14" fill="#b5c1c6"/>
  </g>

  <g id="rbf-head" transform="translate(106.9 95.8) scale(.52)">
    <!-- tête + oreilles -->
  <path id="rbf-head" fill="#b5c1c6" d="M256 210 C250 150 238 80 222 40 C214 18 196 10 178 10 C150 10 128 34 124 74 C120 130 134 190 132 240 C130 292 92 332 92 394 C92 472 166 504 256 504 C346 504 420 472 420 394 C420 332 382 292 380 240 C378 190 392 130 388 74 C384 34 362 10 334 10 C316 10 298 18 290 40 C274 80 262 150 256 210Z"/>
  <g id="rbf-ear-inner" fill="#fba9a9">
    <path d="M178 52 C160 70 150 120 154 170 C156 192 166 204 178 204 C192 204 202 176 200 130 C198 86 190 58 178 52Z"/>
    <path d="M334 52 C352 70 362 120 358 170 C356 192 346 204 334 204 C320 204 310 176 312 130 C314 86 322 58 334 52Z"/>
  </g>

  <!-- liseré blanc qui s'élargit en museau -->
  <path id="rbf-blaze" fill="#fff" d="M240 222 C240 214 246 210 256 210 C266 210 272 214 272 222 L274 304 C274 316 288 326 312 344 C348 370 360 410 348 448 C336 482 296 494 256 494 C216 494 176 482 164 448 C152 410 164 370 200 344 C224 326 238 316 238 304Z"/>

  <g id="rbf-eyes" fill="#2d2927">
    <ellipse cx="184" cy="298" rx="17" ry="28"/><ellipse cx="328" cy="298" rx="17" ry="28"/>
    <g fill="#7b7b7b"><ellipse cx="178" cy="287" rx="5" ry="8"/><ellipse cx="322" cy="287" rx="5" ry="8"/></g>
  </g>

  <g id="rbf-whiskers" fill="none" stroke="#858585" stroke-width="9" stroke-linecap="round">
    <path d="M126 400 C106 396 84 394 62 396"/><path d="M124 424 C102 426 80 428 58 432"/><path d="M130 448 C114 456 94 464 78 474"/>
    <path d="M386 400 C406 396 428 394 450 396"/><path d="M388 424 C410 426 432 428 454 432"/><path d="M382 448 C398 456 418 464 434 474"/>
  </g>

  <!-- truffe en « Y », sourire et dents du bonheur -->
  <g id="rbf-mouth">
    <path d="M236 376 C242 388 250 394 256 394 C262 394 270 388 276 376" fill="none" stroke="#2d2927" stroke-width="11" stroke-linecap="round"/>
    <path d="M256 394 L256 412" stroke="#2d2927" stroke-width="10" stroke-linecap="round"/>
    <path d="M232 414 C240 430 252 430 256 416 C260 430 272 430 280 414" fill="none" stroke="#2d2927" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="240" y="430" width="32" height="34" rx="9" fill="#ffe3b3"/>
    <path d="M256 434 V462" stroke="#f3cf93" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  </g>
</svg>
