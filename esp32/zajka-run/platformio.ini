; Zajka Run pour l'ODROID-GO (ESP32, ecran ILI9341 320x240, croix + A/B, haut-parleur)
;
;   pio run                  build ; donne .pio/build/odroid-go/firmware.bin ET ZajkaRun.fw
;   copier ZajkaRun.fw dans /odroid/firmware/ de la carte SD, puis allumer en tenant B
;   pio run -t upload        flasher directement en USB (remplace le firmware d'origine !)
;   pio device monitor       logs, 115200 bauds
;
; Le jeu (src/game/) ne depend pas d'Arduino : il se teste aussi sur PC, voir sim/.

[platformio]
default_envs = odroid-go

[env:odroid-go]
platform = espressif32@~6.5.0
board = odroid_esp32
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1
; apres le build : firmware.bin -> ZajkaRun.fw (format du firmware d'origine)
extra_scripts = post:scripts/make_fw.py
